name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you trigger a build manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Rust toolchain (stable, cached)
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 3. Install Tauri CLI
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      # 4. Build the app
      - name: Build
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""   # leave blank for unsigned builds

      # 5. Upload artifacts
      - name: Upload NSIS installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: screen-recorder-setup-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: screen-recorder-msi-windows
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload portable .exe
        uses: actions/upload-artifact@v4
        with:
          name: screen-recorder-portable-windows
          path: src-tauri/target/release/screen-recorder.exe
          if-no-files-found: warn

  # Optional: auto-create a GitHub Release on version tags (v1.0.0, etc.)
  release:
    needs: build-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Generate release tag
        id: release_tag
        run: echo "value=v$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${{ steps.release_tag.outputs.value }}`,
              sha: context.sha
            });

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          name: Release ${{ steps.release_tag.outputs.value }}
          generate_release_notes: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
